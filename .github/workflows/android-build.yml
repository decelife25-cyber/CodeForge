name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Generate and Commit APKs
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p APK
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "APK/app-latest-debug.apk"
            cp "$APK_PATH" "APK/app-debug-$TIMESTAMP.apk"

            # Keep only the 10 most recent timestamped APKs
            cd APK
            ls -t app-debug-*.apk | tail -n +11 | xargs -I {} rm -- {} || true
            cd ..

            # Commit and push
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f APK/
            git status
            git commit -m "chore: Update APKs [skip ci]" || echo "No changes to commit"
            git push origin HEAD:main
          else
            echo "APK not found at $APK_PATH"
            exit 1
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
